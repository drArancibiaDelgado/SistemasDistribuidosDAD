<!DOCTYPE html>
<html>
<head><title>Comercio 1</title></head>
<body>
    <h2>Comercio 1</h2>
    <input type="text" id="email" placeholder="Email"><br>
    <input type="password" id="pass" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    
    <h3>Pagar</h3>
    <button onclick="pagar()">Ejecutar Transacción</button>
    <div id="resultado"></div> <script>
        let token = "";
        async function login() {
            let res = await fetch('http://localhost:8000/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('pass').value})
            });
            let data = await res.json();
            token = data.access_token;
            alert("Logueado con éxito");
        }

        async function pagar() {
            let res = await fetch('http://localhost:8000/api/transaccion', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    fecha: new Date().toISOString(),
                    cuentaOrigen: 'BNB-123',
                    cuentaDestino: 'ECO-456',
                    monto: 100
                })
            });
            document.getElementById('resultado').innerText = await res.text();
        }
    </script>
</body>
</html>
